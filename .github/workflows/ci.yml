name: Goffee's Coffee

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel a still-running CI run for this branch/PR when a new push supersedes it, instead of
# wasting runner time on both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the token GitHub injects into every job (${{ secrets.GITHUB_TOKEN }}).
permissions:
  contents: read

jobs:
  # Backend Job (Spring Boot) — pom.xml and src/ live at the repo root
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        run: ./mvnw clean verify

  # 2. Frontend Job (React + Tailwind + Oxlint)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: ./frontend
        run: npm run lint

      # No test runner is set up yet (no vitest/jest, no "test" script) — the frontend is still
      # a scaffold. Add this step back once FRONTEND_EXERCISE.md's components have tests:
      #   - name: Run React Tests
      #     working-directory: ./frontend
      #     run: npm test -- --coverage --passWithNoTests

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  # 3. Publish the image to Docker Hub — only after a merge to main
  publish:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goffeebean:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/goffeebean:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
